services:
  - type: web
    name: suzume-api
    env: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @suzume/api db:generate && pnpm --filter @suzume/api build
    startCommand: pnpm --filter @suzume/api db:migrate:deploy && pnpm --filter @suzume/api start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: EXTRACTION_PROVIDER
        value: mock
