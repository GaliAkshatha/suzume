services:
  postgres:
    image: postgres:16-alpine
    container_name: suzume-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: suzume
      POSTGRES_PASSWORD: suzume
      POSTGRES_DB: suzume
    ports:
      - "5432:5432"
    volumes:
      - suzume_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suzume"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  suzume_postgres_data:
